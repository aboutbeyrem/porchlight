<!doctype html>
<!-- The installer's header on the inner pages: 150 x 57, on the header's white. Rendered to header.bmp. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 150px; height: 57px; overflow: hidden; background: #ffffff; }
  body { display: flex; align-items: center; gap: 9px; padding-left: 14px; box-sizing: border-box; font-family: "Sitka Display", "Sitka Heading", Georgia, serif; }
  .mark { position: relative; width: 26px; height: 26px; border-radius: 50%; background: #121a2e; flex: none; }
  .mark::after { content: ""; position: absolute; left: 9px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #f2b544; box-shadow: 0 0 6px 2px rgba(242, 181, 68, 0.55); }
  .name { color: #121a2e; font-size: 19px; letter-spacing: 0.1px; }
</style>
</head>
<body><span class="mark"></span><span class="name">Porchlight</span></body>
</html>
