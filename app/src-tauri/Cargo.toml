[package]
name = "porchlight"
version = "0.6.2"
description = "Porchlight: a calm security guard for your home network"
authors = ["Beyrem Oueslati"]
license = "MIT"
repository = "https://github.com/aboutbeyrem/porchlight"
edition = "2021"
rust-version = "1.80"

[lib]
name = "porchlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
